steps:
  - name: 'zricethezav/gitleaks:v8.20.1'
    id: 'secret-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner --exit-code 1
    waitFor: ['-']
  - name: 'ubuntu:24.04'
    id: 'install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl git xz-utils tar
        rm -rf /var/lib/apt/lists/*
        FLUTTER_SDK_VERSION=3.44.9
        FLUTTER_SDK_ARCHIVE="flutter_linux_$${FLUTTER_SDK_VERSION}-stable.tar.xz"
        FLUTTER_SDK_SHA256=a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb
        FLUTTER_SDK_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$${FLUTTER_SDK_ARCHIVE}"
        echo "==> downloading Flutter $${FLUTTER_SDK_VERSION}"
        curl -fsSL -o /tmp/$${FLUTTER_SDK_ARCHIVE} "$${FLUTTER_SDK_URL}"
        echo "$${FLUTTER_SDK_SHA256}  /tmp/$${FLUTTER_SDK_ARCHIVE}" | sha256sum -c -
        mkdir -p /opt/flutter-sdk /opt/pub-cache
        tar -xf /tmp/$${FLUTTER_SDK_ARCHIVE} -C /opt/flutter-sdk
        rm -f /tmp/$${FLUTTER_SDK_ARCHIVE}
        export PATH="/opt/flutter-sdk/flutter/bin:$${PATH}"
        export PUB_CACHE=/opt/pub-cache
        flutter --version
        dart --version
        flutter pub get --enforce-lockfile
    volumes:
      - name: 'blekey-flutter-sdk'
        path: '/opt/flutter-sdk'
      - name: 'blekey-pub-cache'
        path: '/opt/pub-cache'
    waitFor: ['-']
  - name: 'ubuntu:24.04'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git ca-certificates
        rm -rf /var/lib/apt/lists/*
        export PATH="/opt/flutter-sdk/flutter/bin:$${PATH}"
        export PUB_CACHE=/opt/pub-cache
        dart --version
        dart analyze --fatal-infos --fatal-warnings
    volumes:
      - name: 'blekey-flutter-sdk'
        path: '/opt/flutter-sdk'
      - name: 'blekey-pub-cache'
        path: '/opt/pub-cache'
    waitFor: ['install']
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
