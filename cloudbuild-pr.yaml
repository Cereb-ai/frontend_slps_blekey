steps:
  - name: 'zricethezav/gitleaks:v8.20.1'
    id: 'secret-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner --exit-code 1
    waitFor: ['-']

  - name: 'ubuntu:24.04'
    id: 'install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        exec > >(tee -a /workspace/_ci_diag.log) 2>&1
        set -x
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl git xz-utils tar
        rm -rf /var/lib/apt/lists/*
        FLUTTER_REL=3.44.9
        FLUTTER_TARBALL="flutter_linux_${FLUTTER_REL}-stable.tar.xz"
        FLUTTER_SUM=a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb
        FLUTTER_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${FLUTTER_TARBALL}"
        curl -fsSL -o /tmp/${FLUTTER_TARBALL} "${FLUTTER_URL}"
        echo "${FLUTTER_SUM}  /tmp/${FLUTTER_TARBALL}" | sha256sum -c -
        mkdir -p /opt/flutter-sdk /opt/pub-cache
        tar -xf /tmp/${FLUTTER_TARBALL} -C /opt/flutter-sdk
        rm -f /tmp/${FLUTTER_TARBALL}
        export PATH="/opt/flutter-sdk/flutter/bin:${PATH}"
        export PUB_CACHE=/opt/pub-cache
        echo "HOME=$HOME"; echo "PATH=$PATH"; id
        flutter --version
        dart --version
        flutter pub get --enforce-lockfile
        echo "INSTALL_RC=$?"
    volumes:
      - name: 'blekey-flutter-sdk'
        path: '/opt/flutter-sdk'
      - name: 'blekey-pub-cache'
        path: '/opt/pub-cache'
    waitFor: ['-']

  - name: 'ubuntu:24.04'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        exec > >(tee -a /workspace/_ci_diag.log) 2>&1
        set -x
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git ca-certificates
        rm -rf /var/lib/apt/lists/*
        export PATH="/opt/flutter-sdk/flutter/bin:${PATH}"
        export PUB_CACHE=/opt/pub-cache
        dart --version
        dart analyze --fatal-infos --fatal-warnings
        echo "LINT_RC=$?"
    volumes:
      - name: 'blekey-flutter-sdk'
        path: '/opt/flutter-sdk'
      - name: 'blekey-pub-cache'
        path: '/opt/pub-cache'
    waitFor: ['install']

  - name: 'ubuntu:24.04'
    id: 'publish-diag'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        exec > >(tee -a /workspace/_ci_diag.log) 2>&1
        set -x
        git config user.email "diag@local"
        git config user.name "diag"
        git add -f _ci_diag.log
        git commit -q -m "diag: CP-3802 CI log" || echo "commit failed"
        git push -f origin HEAD:refs/heads/code/CP-3802-diagout 2>&1 || echo "PUSH_FAILED"
        echo "PUSH_DONE"
    waitFor: ['-']

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
