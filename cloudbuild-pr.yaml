steps:
  - name: 'zricethezav/gitleaks:v8.20.1'
    id: 'secret-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner --exit-code 1
    waitFor: ['-']
  - name: 'ubuntu:24.04'
    id: 'probe'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "PROBE-OK"
    waitFor: ['-']
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
