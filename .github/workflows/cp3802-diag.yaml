name: cp3802-diag
on:
  push:
    branches: ['code/CP-3802-diag2']
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: diag
        run: |
          set -x
          id
          ls -la
          echo "=== apt git ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends git curl xz-utils tar
          git --version
          echo "=== download flutter ==="
          curl -fsSL -o /tmp/f.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz"
          echo "a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb  /tmp/f.tar.xz" | sha256sum -c -
          mkdir -p /opt/flutter-sdk /opt/pub-cache
          sudo tar -xf /tmp/f.tar.xz -C /opt/flutter-sdk
          export PATH=/opt/flutter-sdk/flutter/bin:$PATH
          export PUB_CACHE=/opt/pub-cache
          flutter --version
          dart --version
          echo "=== pub get ==="
          flutter pub get --enforce-lockfile
          echo "=== analyze ==="
          dart analyze --fatal-infos --fatal-warnings
